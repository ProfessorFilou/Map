<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ÖPNV</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0a0b10;
      --panel: #11141b;
      --card: #181c26;
      --border: #2a3040;
      --text: #f0f2f7;
      --muted: #8a93a6;
      --accent: #5b8def;
      --u: #0065b0;
      --s: #008c4f;
      --tram: #e30613;
      --bus: #f5a623;
      --green: #34d399;
      --red: #f87171;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
    }

    #app {
      display: grid;
      grid-template-columns: 400px 1fr;
      height: 100dvh;
    }

    @media (max-width: 880px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
      }
    }

    .panel {
      background: var(--panel);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      z-index: 20;
      max-height: 100dvh;
    }

    @media (max-width: 880px) {
      .panel {
        border-right: none;
        border-radius: 20px 20px 0 0;
        max-height: 46dvh;
        box-shadow: 0 -10px 40px rgba(0,0,0,.5);
        order: 2;
      }
    }

    .top {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    @media (max-width: 880px) {
      .handle {
        width: 36px;
        height: 4px;
        background: #3a4356;
        border-radius: 2px;
        margin: 0 auto 12px;
      }
    }

    .title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
    }

    .search-box {
      margin-top: 12px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      height: 44px;
      padding: 0 12px 0 40px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      opacity: .5;
      pointer-events: none;
    }

    .results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-height: 260px;
      overflow-y: auto;
      display: none;
      z-index: 30;
      box-shadow: 0 12px 30px rgba(0,0,0,.4);
    }

    .results.show { display: block; }

    .result {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .result:last-child { border-bottom: none; }
    .result:hover, .result:active { background: #222836; }
    .result .name { font-weight: 600; font-size: 14px; }
    .result .place { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .filters {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar { display: none; }

    .chip {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
    }

    .chip.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .deps {
      flex: 1;
      overflow-y: auto;
      padding-bottom: max(18px, env(safe-area-inset-bottom));
    }

    .dep {
      display: grid;
      grid-template-columns: 50px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 11px 16px;
      border-bottom: 1px solid rgba(42,48,64,.45);
    }

    .badge {
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      color: #fff;
    }

    .badge.u { background: var(--u); }
    .badge.s { background: var(--s); }
    .badge.tram { background: var(--tram); }
    .badge.bus { background: var(--bus); color: #111; }
    .badge.x { background: #4a5368; }

    .dest {
      font-size: 14px;
      font-weight: 550;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .time {
      text-align: right;
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 48px;
    }

    .time small {
      display: block;
      font-size: 11px;
      font-weight: 600;
      margin-top: 1px;
    }

    .live { color: var(--green); }
    .delay { color: var(--red); }

    .empty {
      padding: 36px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    #map {
      width: 100%;
      height: 100%;
      order: 1;
      background: #0c0f16;
    }

    .map-btn {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      z-index: 15;
      width: 42px;
      height: 42px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
      cursor: pointer;
    }

    .map-btn svg { width: 18px; height: 18px; }

    .user {
      width: 16px;
      height: 16px;
      background: #5b8def;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(91,141,239,.25);
    }

    .stop {
      width: 14px;
      height: 14px;
      background: var(--accent);
      border: 2.5px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(91,141,239,.2);
    }
  </style>
</head>
<body>
  <div id="app">
    <aside class="panel">
      <div class="top">
        <div class="handle"></div>
        <div class="title" id="title">Haltestelle suchen</div>
        <div class="sub" id="sub">Suche starten oder Standort nutzen</div>

        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input id="q" type="text" placeholder="Haltestelle eingeben…" autocomplete="off" />
          <div id="results" class="results"></div>
        </div>
      </div>

      <div class="filters" id="filters">
        <button class="chip on" data-f="all">Alle</button>
        <button class="chip" data-f="u">U-Bahn</button>
        <button class="chip" data-f="s">S-Bahn</button>
        <button class="chip" data-f="tram">Tram</button>
        <button class="chip" data-f="bus">Bus</button>
      </div>

      <div class="deps" id="deps">
        <div class="empty">
          Suche eine Haltestelle<br>
          oder tippe auf den Standort-Button
        </div>
      </div>
    </aside>

    <div id="map"></div>
    <button class="map-btn" id="loc" title="Standort">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      </svg>
    </button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map", {
      zoomControl: false,
      attributionControl: false
    }).setView([48.137, 11.575], 12);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 19
    }).addTo(map);

    L.control.zoom({ position: "bottomright" }).addTo(map);

    let userMarker = null;
    let stopMarker = null;
    let current = null;
    let allDeps = [];
    let filter = "all";
    let refresh = null;

    function type(t, label) {
      const a = (t || "").toUpperCase();
      const b = (label || "").toUpperCase();
      if (a.includes("UBAHN") || b.startsWith("U")) return "u";
      if (a.includes("SBAHN") || b.startsWith("S")) return "s";
      if (a.includes("TRAM")) return "tram";
      if (a.includes("BUS")) return "bus";
      return "x";
    }

    function minutes(ms) {
      const m = Math.round((ms - Date.now()) / 60000);
      return m <= 0 ? "jetzt" : m + " min";
    }

    async function search(q) {
      const box = document.getElementById("results");
      if (!q || q.length < 2) {
        box.classList.remove("show");
        return;
      }

      try {
        const res = await fetch("https://www.mvg.de/api/bgw-pt/v3/locations?query=" + encodeURIComponent(q));
        const data = await res.json();
        const list = (Array.isArray(data) ? data : []).filter(x => x.globalId || x.id).slice(0, 8);

        if (!list.length) {
          box.innerHTML = `<div class="result"><div class="name">Keine Treffer</div></div>`;
          box.classList.add("show");
          return;
        }

        box.innerHTML = list.map(s => `
          <div class="result" data-id="${s.globalId || s.id}" data-name="${s.name}" data-lat="${s.latitude}" data-lon="${s.longitude}" data-place="${s.place || ""}">
            <div class="name">${s.name}</div>
            <div class="place">${s.place || ""}</div>
          </div>
        `).join("");

        box.classList.add("show");

        box.querySelectorAll(".result").forEach(el => {
          el.onclick = () => {
            select({
              id: el.dataset.id,
              name: el.dataset.name,
              lat: +el.dataset.lat,
              lon: +el.dataset.lon,
              place: el.dataset.place
            });
            box.classList.remove("show");
            document.getElementById("q").value = el.dataset.name;
          };
        });
      } catch {
        box.innerHTML = `<div class="result"><div class="name">Fehler</div><div class="place">Netzwerk / CORS</div></div>`;
        box.classList.add("show");
      }
    }

    async function load(station) {
      document.getElementById("title").textContent = station.name;
      document.getElementById("sub").textContent = station.place ? station.place + " · Live" : "Live-Abfahrten";
      document.getElementById("deps").innerHTML = `<div class="empty">Lade Abfahrten…</div>`;

      try {
        let res = await fetch("https://www.mvg.de/api/bgw-pt/v3/departures?globalId=" + encodeURIComponent(station.id));
        if (!res.ok) {
          res = await fetch("https://www.mvg.de/api/fib/v2/departure?globalId=" + encodeURIComponent(station.id));
        }
        const data = await res.json();
        allDeps = Array.isArray(data) ? data : (data.departures || []);
        render();
      } catch {
        document.getElementById("deps").innerHTML = `<div class="empty">Abfahrten nicht ladbar<br><small>CORS oder API</small></div>`;
      }
    }

    function render() {
      let list = allDeps;
      if (filter !== "all") {
        list = list.filter(d => type(d.transportType || d.product, d.label || d.line) === filter);
      }

      if (!list.length) {
        document.getElementById("deps").innerHTML = `<div class="empty">Keine Abfahrten</div>`;
        return;
      }

      const now = Date.now();
      let html = "";

      list.slice(0, 30).forEach(d => {
        const label = d.label || d.line || "?";
        const dest = d.destination || d.direction || "–";
        const t = type(d.transportType || d.product, label);
        const rt = d.realtimeDepartureTime || d.departureTime || now;
        const delay = d.delayInMinutes || 0;
        const platform = d.platform || "";

        let extra = "";
        if (delay > 0) extra = `<small class="delay">+${delay} min</small>`;
        else if (d.realtime) extra = `<small class="live">LIVE</small>`;

        html += `
          <div class="dep">
            <div class="badge ${t}">${label}</div>
            <div>
              <div class="dest">${dest}</div>
              <div class="meta">${platform ? "Gl. " + platform : ""}${d.cancelled ? " · entfällt" : ""}</div>
            </div>
            <div class="time">
              ${minutes(rt)}
              ${extra}
            </div>
          </div>
        `;
      });

      document.getElementById("deps").innerHTML = html;
    }

    function select(station) {
      current = station;

      if (stopMarker) map.removeLayer(stopMarker);
      stopMarker = L.marker([station.lat, station.lon], {
        icon: L.divIcon({
          className: "",
          html: '<div class="stop"></div>',
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        })
      }).addTo(map);

      map.flyTo([station.lat, station.lon], 15.5, { duration: 0.7 });
      load(station);

      if (refresh) clearInterval(refresh);
      refresh = setInterval(() => load(station), 30000);
    }

    function locate() {
      if (!navigator.geolocation) {
        alert("Standort nicht verfügbar");
        return;
      }

      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;

        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.marker([latitude, longitude], {
          icon: L.divIcon({
            className: "",
            html: '<div class="user"></div>',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
          })
        }).addTo(map);

        map.setView([latitude, longitude], 14);
        document.getElementById("title").textContent = "Dein Standort";
        document.getElementById("sub").textContent = "Jetzt Haltestelle suchen";
        document.getElementById("deps").innerHTML = `<div class="empty">Standort gefunden.<br>Suche jetzt eine Haltestelle.</div>`;
      }, () => {
        alert("Standort konnte nicht ermittelt werden");
      }, { enableHighAccuracy: true, timeout: 10000 });
    }

    // Events
    let timer;
    document.getElementById("q").addEventListener("input", e => {
      clearTimeout(timer);
      timer = setTimeout(() => search(e.target.value.trim()), 200);
    });

    document.getElementById("loc").onclick = locate;

    document.getElementById("filters").onclick = e => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
      chip.classList.add("on");
      filter = chip.dataset.f;
      render();
    };

    document.addEventListener("click", e => {
      if (!e.target.closest(".search-box")) {
        document.getElementById("results").classList.remove("show");
      }
    });
  </script>
</body>
</html>
