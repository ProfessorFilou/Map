<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Navi · München</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0c0e14;
      --panel: #151922;
      --border: #2a3142;
      --text: #f1f3f7;
      --muted: #8b93a8;
      --accent: #4f8cff;
      --green: #22c55e;
      --orange: #f59e0b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
    }
    #map { position: absolute; inset: 0; z-index: 1; }

    /* ===== TOP PANEL ===== */
    .top {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 12px 14px 0;
      background: linear-gradient(to bottom, rgba(12,14,20,0.97) 70%, transparent);
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }
    .row:last-child { margin-bottom: 0; }
    .dots {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 18px;
    }
    .dot-from { width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
    .dot-line { width: 2px; height: 18px; background: var(--border); }
    .dot-to { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }

    .inputs { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .input-wrap { position: relative; }
    input {
      width: 100%;
      padding: 12px 40px 12px 14px;
      background: #0f1219;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .loc-btn {
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--accent);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    .modes {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }
    .mode {
      flex: 1;
      padding: 9px 0;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: #0f1219;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .mode.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .go-btn {
      margin-top: 12px;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #4f8cff, #6366f1);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .go-btn:active { opacity: 0.9; }

    /* Suggestions */
    .suggest {
      position: absolute;
      left: 14px; right: 14px;
      top: 100%;
      margin-top: 4px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 20;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .suggest.show { display: block; }
    .sug-item {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      font-size: 14px;
    }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:active { background: #1c2230; }
    .sug-item small { color: var(--muted); display: block; margin-top: 2px; }

    /* ===== BOTTOM SHEET ===== */
    .sheet {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 1000;
      background: var(--panel);
      border-radius: 22px 22px 0 0;
      max-height: 42%;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .sheet.open { transform: translateY(0); }
    .handle {
      width: 40px; height: 5px;
      background: #3a4258;
      border-radius: 3px;
      margin: 10px auto 4px;
    }
    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 28px;
      -webkit-overflow-scrolling: touch;
    }
    .route-card {
      background: #0f1219;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .route-card:active { border-color: var(--accent); }
    .route-card .time {
      font-size: 20px;
      font-weight: 800;
    }
    .route-card .meta {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    .route-card .legs {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .leg {
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      color: white;
    }
    .leg.u { background: #0065b0; }
    .leg.s { background: #008c4f; }
    .leg.tram { background: #e30613; }
    .leg.bus { background: #f5a623; color: #111; }
    .leg.walk { background: #64748b; }
    .leg.car { background: #3b82f6; }
    .leg.bike { background: #10b981; }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 30px 10px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="top">
    <div class="card">
      <div class="row">
        <div class="dots">
          <div class="dot-from"></div>
          <div class="dot-line"></div>
          <div class="dot-to"></div>
        </div>
        <div class="inputs">
          <div class="input-wrap">
            <input id="from" placeholder="Von (Adresse oder Haltestelle)" autocomplete="off" />
            <button class="loc-btn" id="myLoc" title="Mein Standort">📍</button>
            <div class="suggest" id="fromSug"></div>
          </div>
          <div class="input-wrap">
            <input id="to" placeholder="Nach (Adresse oder Haltestelle)" autocomplete="off" />
            <div class="suggest" id="toSug"></div>
          </div>
        </div>
      </div>

      <div class="modes">
        <div class="mode active" data-mode="transit">ÖPNV</div>
        <div class="mode" data-mode="car">Auto</div>
        <div class="mode" data-mode="bike">Fahrrad</div>
        <div class="mode" data-mode="foot">Zu Fuß</div>
      </div>

      <button class="go-btn" id="go">Route berechnen</button>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="handle"></div>
    <div class="sheet-body" id="sheetBody">
      <div class="empty-msg">Route berechnen, um Vorschläge zu sehen</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ========== STATE ==========
    let mode = 'transit';
    let fromPlace = null;
    let toPlace = null;
    let routeLayer = null;
    let markers = [];

    // ========== MAP ==========
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([48.137, 11.575], 13);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // ========== HELPERS ==========
    function clearRoute() {
      if (routeLayer) map.removeLayer(routeLayer);
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      routeLayer = null;
    }

    function addMarker(lat, lon, color) {
      const m = L.circleMarker([lat, lon], {
        radius: 8,
        color: '#fff',
        weight: 2,
        fillColor: color,
        fillOpacity: 1
      }).addTo(map);
      markers.push(m);
      return m;
    }

    // ========== SEARCH (Nominatim + MVG) ==========
    async function searchPlaces(query, target) {
      if (!query || query.length < 2) {
        target.classList.remove('show');
        return;
      }
      try {
        // Erst MVG-Stationen versuchen
        const mvgRes = await fetch(`https://www.mvg.de/api/bgw-pt/v3/locations?query=${encodeURIComponent(query)}`);
        const mvgData = await mvgRes.json();
        let items = (Array.isArray(mvgData) ? mvgData : []).slice(0, 5).map(s => ({
          name: s.name,
          place: s.place || 'München',
          lat: s.latitude,
          lon: s.longitude,
          id: s.globalId || s.id,
          type: 'station'
        }));

        // Falls wenig Treffer → Nominatim ergänzen
        if (items.length < 3) {
          const nom = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ' München')}&limit=4`);
          const nomData = await nom.json();
          items = items.concat(nomData.map(n => ({
            name: n.display_name.split(',')[0],
            place: n.display_name,
            lat: parseFloat(n.lat),
            lon: parseFloat(n.lon),
            type: 'place'
          })));
        }

        target.innerHTML = items.map((it, i) => `
          <div class="sug-item" data-i="${i}">
            ${it.name}
            <small>${it.place}</small>
          </div>
        `).join('');
        target.classList.add('show');
        target._items = items;

        target.querySelectorAll('.sug-item').forEach(el => {
          el.onclick = () => {
            const item = items[el.dataset.i];
            if (target.id === 'fromSug') {
              fromPlace = item;
              document.getElementById('from').value = item.name;
            } else {
              toPlace = item;
              document.getElementById('to').value = item.name;
            }
            target.classList.remove('show');
          };
        });
      } catch (e) {
        target.innerHTML = `<div class="sug-item">Suche fehlgeschlagen</div>`;
        target.classList.add('show');
      }
    }

    // Debounce
    let t1, t2;
    document.getElementById('from').addEventListener('input', e => {
      clearTimeout(t1);
      t1 = setTimeout(() => searchPlaces(e.target.value.trim(), document.getElementById('fromSug')), 280);
    });
    document.getElementById('to').addEventListener('input', e => {
      clearTimeout(t2);
      t2 = setTimeout(() => searchPlaces(e.target.value.trim(), document.getElementById('toSug')), 280);
    });

    // Mein Standort
    document.getElementById('myLoc').onclick = () => {
      if (!navigator.geolocation) return alert('Standort nicht verfügbar');
      navigator.geolocation.getCurrentPosition(pos => {
        fromPlace = {
          name: 'Mein Standort',
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          type: 'geo'
        };
        document.getElementById('from').value = 'Mein Standort';
        map.flyTo([fromPlace.lat, fromPlace.lon], 15);
      }, () => alert('Standort konnte nicht ermittelt werden'));
    };

    // Mode Switch
    document.querySelectorAll('.mode').forEach(el => {
      el.onclick = () => {
        document.querySelectorAll('.mode').forEach(m => m.classList.remove('active'));
        el.classList.add('active');
        mode = el.dataset.mode;
      };
    });

    // ========== ROUTING ==========
    async function calcRoute() {
      if (!fromPlace || !toPlace) {
        alert('Bitte Start und Ziel wählen');
        return;
      }

      clearRoute();
      const sheet = document.getElementById('sheet');
      const body = document.getElementById('sheetBody');
      body.innerHTML = `<div class="empty-msg">Berechne Route…</div>`;
      sheet.classList.add('open');

      addMarker(fromPlace.lat, fromPlace.lon, '#22c55e');
      addMarker(toPlace.lat, toPlace.lon, '#ef4444');

      try {
        if (mode === 'transit') {
          await routeTransit();
        } else {
          await routeOSRM();
        }
      } catch (err) {
        console.error(err);
        body.innerHTML = `<div class="empty-msg">Route konnte nicht berechnet werden<br><small>${err.message || ''}</small></div>`;
      }
    }

    // ÖPNV über MVG
    async function routeTransit() {
      const body = document.getElementById('sheetBody');

      // Wenn keine Station-IDs, erst über Koordinaten/Name auflösen
      let originId = fromPlace.id;
      let destId = toPlace.id;

      if (!originId || !destId) {
        // Fallback: einfache Anzeige
        body.innerHTML = `<div class="empty-msg">Für ÖPNV bitte Haltestellen auswählen (nicht nur Adressen)</div>`;
        return;
      }

      const url = `https://www.mvg.de/api/bgw-pt/v3/routes?originStationGlobalId=${encodeURIComponent(originId)}&destinationStationGlobalId=${encodeURIComponent(destId)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('MVG Routing fehlgeschlagen');
      const data = await res.json();

      const routes = Array.isArray(data) ? data : (data.routes || data.connections || []);
      if (!routes.length) {
        body.innerHTML = `<div class="empty-msg">Keine ÖPNV-Verbindung gefunden</div>`;
        return;
      }

      let html = '';
      routes.slice(0, 5).forEach((r, idx) => {
        // Sehr unterschiedliche Response-Strukturen → robust parsen
        const duration = r.duration || r.travelTime || Math.round((r.arrival || 0) - (r.departure || 0)) / 60000 || '–';
        const legs = r.legs || r.parts || [];
        let legHtml = '';
        legs.forEach(l => {
          const label = l.label || l.line || l.transportType || 'Walk';
          const t = (l.transportType || l.product || label).toUpperCase();
          let cls = 'walk';
          if (t.includes('U')) cls = 'u';
          else if (t.includes('S')) cls = 's';
          else if (t.includes('TRAM')) cls = 'tram';
          else if (t.includes('BUS')) cls = 'bus';
          legHtml += `<span class="leg ${cls}">${label}</span>`;
        });
        if (!legHtml) legHtml = `<span class="leg walk">Verbindung</span>`;

        html += `
          <div class="route-card" data-idx="${idx}">
            <div class="time">${typeof duration === 'number' ? duration + ' min' : duration}</div>
            <div class="meta">ÖPNV · Verbindung ${idx + 1}</div>
            <div class="legs">${legHtml}</div>
          </div>
        `;
      });
      body.innerHTML = html;

      // Erste Route grob auf Karte (nur Start–Ziel Linie, da Polylines oft fehlen)
      const latlngs = [[fromPlace.lat, fromPlace.lon], [toPlace.lat, toPlace.lon]];
      routeLayer = L.polyline(latlngs, { color: '#4f8cff', weight: 5, opacity: 0.85 }).addTo(map);
      map.fitBounds(routeLayer.getBounds(), { padding: [80, 80] });
    }

    // Auto / Bike / Foot über öffentlichen OSRM
    async function routeOSRM() {
      const body = document.getElementById('sheetBody');
      const profile = mode === 'car' ? 'driving' : mode === 'bike' ? 'cycling' : 'foot';

      // Public OSRM Demo (kann rate-limited sein)
      const url = `https://router.project-osrm.org/route/v1/${profile}/${fromPlace.lon},${fromPlace.lat};${toPlace.lon},${toPlace.lat}?overview=full&geometries=geojson`;
      const res = await fetch(url);
      const data = await res.json();

      if (data.code !== 'Ok' || !data.routes?.length) {
        throw new Error('Keine Route gefunden');
      }

      const r = data.routes[0];
      const mins = Math.round(r.duration / 60);
      const km = (r.distance / 1000).toFixed(1);

      body.innerHTML = `
        <div class="route-card">
          <div class="time">${mins} min</div>
          <div class="meta">${km} km · ${mode === 'car' ? 'Auto' : mode === 'bike' ? 'Fahrrad' : 'Zu Fuß'}</div>
          <div class="legs">
            <span class="leg ${mode === 'car' ? 'car' : mode === 'bike' ? 'bike' : 'walk'}">
              ${mode === 'car' ? 'Auto' : mode === 'bike' ? 'Fahrrad' : 'Fußweg'}
            </span>
          </div>
        </div>
      `;

      const coords = r.geometry.coordinates.map(c => [c[1], c[0]]);
      routeLayer = L.polyline(coords, {
        color: mode === 'car' ? '#3b82f6' : mode === 'bike' ? '#10b981' : '#94a3b8',
        weight: 6,
        opacity: 0.9
      }).addTo(map);
      map.fitBounds(routeLayer.getBounds(), { padding: [70, 70] });
    }

    document.getElementById('go').onclick = calcRoute;
  </script>
</body>
</html>
