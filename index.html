<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Navi Maps</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0b0d13;
      --panel: #141820;
      --border: #2a3142;
      --text: #f1f3f7;
      --muted: #8b93a8;
      --accent: #4f8cff;
      --green: #22c55e;
      --red: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
    }
    #map { position: absolute; inset: 0; z-index: 1; }

    /* Top Controls */
    .top {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 10px 12px 0;
      pointer-events: none;
    }
    .top > * { pointer-events: auto; }

    .search-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .row { display: flex; gap: 8px; align-items: flex-start; }
    .dots {
      display: flex; flex-direction: column; align-items: center;
      padding-top: 12px; gap: 3px; width: 16px;
    }
    .dot-a { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
    .dot-line { width: 2px; height: 22px; background: var(--border); }
    .dot-b { width: 9px; height: 9px; border-radius: 50%; background: var(--red); }

    .fields { flex: 1; display: flex; flex-direction: column; gap: 7px; }
    .field { position: relative; }
    input {
      width: 100%;
      padding: 11px 38px 11px 12px;
      background: #0e1118;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      font-size: 14.5px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .icon-btn {
      position: absolute; right: 6px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--accent); font-size: 17px;
      cursor: pointer; padding: 4px;
    }

    .modes {
      display: flex; gap: 5px; margin-top: 10px;
    }
    .mode {
      flex: 1; text-align: center;
      padding: 8px 0;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0e1118;
      color: var(--muted);
      font-size: 12px; font-weight: 600;
      cursor: pointer;
    }
    .mode.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .actions {
      display: flex; gap: 8px; margin-top: 10px;
    }
    .btn {
      flex: 1; padding: 11px;
      border: none; border-radius: 11px;
      font-size: 14px; font-weight: 700;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f8cff, #6366f1);
      color: white;
    }
    .btn-secondary {
      background: #1c2230;
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* Suggestions */
    .suggest {
      position: absolute; left: 0; right: 0; top: 100%;
      margin-top: 3px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 11px;
      max-height: 200px; overflow-y: auto;
      z-index: 30; display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.45);
    }
    .suggest.show { display: block; }
    .sug {
      padding: 11px 13px;
      border-bottom: 1px solid var(--border);
      font-size: 13.5px; cursor: pointer;
    }
    .sug:last-child { border-bottom: none; }
    .sug small { color: var(--muted); display: block; margin-top: 2px; }

    /* Floating controls */
    .float-btns {
      position: absolute;
      right: 12px; bottom: 180px;
      z-index: 900;
      display: flex; flex-direction: column; gap: 8px;
    }
    .fab {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    /* Map style menu */
    .style-menu {
      position: absolute;
      right: 60px; bottom: 180px;
      z-index: 950;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      min-width: 130px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .style-menu.open { display: flex; }
    .style-opt {
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      color: var(--muted);
    }
    .style-opt.active, .style-opt:hover {
      background: #1c2230;
      color: var(--text);
    }

    /* Bottom Sheet */
    .sheet {
      position: absolute; bottom: 0; left: 0; right: 0;
      z-index: 1000;
      background: var(--panel);
      border-radius: 20px 20px 0 0;
      max-height: 40%;
      display: flex; flex-direction: column;
      box-shadow: 0 -8px 35px rgba(0,0,0,0.5);
      transform: translateY(105%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .sheet.open { transform: translateY(0); }
    .handle {
      width: 36px; height: 4px;
      background: #3a4258;
      border-radius: 2px;
      margin: 9px auto 2px;
    }
    .sheet-content {
      flex: 1; overflow-y: auto;
      padding: 8px 14px 24px;
      -webkit-overflow-scrolling: touch;
    }
    .route-item {
      background: #0e1118;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .route-item .dur {
      font-size: 19px; font-weight: 800;
    }
    .route-item .info {
      font-size: 12.5px; color: var(--muted); margin-top: 3px;
    }
    .legs {
      display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px;
    }
    .leg {
      padding: 3px 8px; border-radius: 7px;
      font-size: 11px; font-weight: 700; color: #fff;
    }
    .leg.u { background: #0065b0; }
    .leg.s { background: #008c4f; }
    .leg.tram { background: #e30613; }
    .leg.bus { background: #f5a623; color: #111; }
    .leg.walk { background: #64748b; }
    .leg.car { background: #3b82f6; }
    .leg.bike { background: #10b981; }

    .msg {
      text-align: center; color: var(--muted);
      padding: 28px 10px; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Top Search -->
  <div class="top">
    <div class="search-card">
      <div class="row">
        <div class="dots">
          <div class="dot-a"></div>
          <div class="dot-line"></div>
          <div class="dot-b"></div>
        </div>
        <div class="fields">
          <div class="field">
            <input id="from" placeholder="Start" autocomplete="off" />
            <button class="icon-btn" id="myLoc" title="Mein Standort">📍</button>
            <div class="suggest" id="fromSug"></div>
          </div>
          <div class="field">
            <input id="to" placeholder="Ziel" autocomplete="off" />
            <div class="suggest" id="toSug"></div>
          </div>
        </div>
      </div>

      <div class="modes">
        <div class="mode active" data-m="transit">ÖPNV</div>
        <div class="mode" data-m="car">Auto</div>
        <div class="mode" data-m="bike">Fahrrad</div>
        <div class="mode" data-m="foot">Zu Fuß</div>
      </div>

      <div class="actions">
        <button class="btn btn-secondary" id="swap">⇅</button>
        <button class="btn btn-primary" id="go">Route</button>
      </div>
    </div>
  </div>

  <!-- Floating buttons -->
  <div class="float-btns">
    <button class="fab" id="btnLocate" title="Standort">⌖</button>
    <button class="fab" id="btnStyle" title="Kartentyp">🗺️</button>
  </div>

  <div class="style-menu" id="styleMenu">
    <div class="style-opt active" data-style="dark">Dunkel</div>
    <div class="style-opt" data-style="light">Hell</div>
    <div class="style-opt" data-style="streets">Straßen</div>
    <div class="style-opt" data-style="outdoors">Outdoor</div>
  </div>

  <!-- Bottom Sheet -->
  <div class="sheet" id="sheet">
    <div class="handle"></div>
    <div class="sheet-content" id="sheetContent">
      <div class="msg">Start und Ziel eingeben und Route berechnen</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ===================== STATE =====================
    let mode = 'transit';
    let fromP = null, toP = null;
    let routeLayer = null, markers = [];
    let baseLayer = null;
    let userMarker = null;

    // ===================== MAP STYLES =====================
    const styles = {
      dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }),
      light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }),
      streets: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }),
      outdoors: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 })
    };

    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false,
      preferCanvas: true
    }).setView([48.137, 11.575], 13);

    baseLayer = styles.dark.addTo(map);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    // ===================== HELPERS =====================
    function clearRoute() {
      if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
      markers.forEach(m => map.removeLayer(m));
      markers = [];
    }

    function mark(lat, lon, color) {
      const m = L.circleMarker([lat, lon], {
        radius: 7, color: '#fff', weight: 2,
        fillColor: color, fillOpacity: 1
      }).addTo(map);
      markers.push(m);
    }

    // ===================== SEARCH =====================
    async function doSearch(q, box) {
      if (!q || q.length < 2) { box.classList.remove('show'); return; }
      try {
        let items = [];
        // MVG stations first
        try {
          const r = await fetch(`https://www.mvg.de/api/bgw-pt/v3/locations?query=${encodeURIComponent(q)}`);
          const d = await r.json();
          items = (Array.isArray(d) ? d : []).slice(0, 4).map(s => ({
            name: s.name, place: s.place || 'München',
            lat: s.latitude, lon: s.longitude,
            id: s.globalId || s.id, type: 'station'
          }));
        } catch(e) {}

        // Nominatim supplement
        const n = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q + (q.toLowerCase().includes('münchen') ? '' : ' München'))}&limit=4`);
        const nd = await n.json();
        items = items.concat(nd.map(x => ({
          name: x.display_name.split(',')[0],
          place: x.display_name,
          lat: +x.lat, lon: +x.lon, type: 'place'
        })));

        box.innerHTML = items.map((it, i) => `
          <div class="sug" data-i="${i}">${it.name}<small>${it.place}</small></div>
        `).join('');
        box._data = items;
        box.classList.add('show');

        box.querySelectorAll('.sug').forEach(el => {
          el.onclick = () => {
            const it = items[+el.dataset.i];
            if (box.id === 'fromSug') {
              fromP = it;
              document.getElementById('from').value = it.name;
            } else {
              toP = it;
              document.getElementById('to').value = it.name;
            }
            box.classList.remove('show');
          };
        });
      } catch(e) {
        box.innerHTML = `<div class="sug">Keine Ergebnisse</div>`;
        box.classList.add('show');
      }
    }

    let tA, tB;
    document.getElementById('from').oninput = e => {
      clearTimeout(tA);
      tA = setTimeout(() => doSearch(e.target.value.trim(), document.getElementById('fromSug')), 260);
    };
    document.getElementById('to').oninput = e => {
      clearTimeout(tB);
      tB = setTimeout(() => doSearch(e.target.value.trim(), document.getElementById('toSug')), 260);
    };

    // ===================== LOCATION =====================
    function getLocation(cb) {
      if (!navigator.geolocation) return alert('Standort nicht verfügbar');
      navigator.geolocation.getCurrentPosition(p => {
        const lat = p.coords.latitude, lon = p.coords.longitude;
        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.circleMarker([lat, lon], {
          radius: 8, color: '#fff', weight: 2,
          fillColor: '#4f8cff', fillOpacity: 1
        }).addTo(map);
        map.flyTo([lat, lon], 15);
        cb && cb(lat, lon);
      }, () => alert('Standort konnte nicht ermittelt werden'));
    }

    document.getElementById('myLoc').onclick = () => {
      getLocation((lat, lon) => {
        fromP = { name: 'Mein Standort', lat, lon, type: 'geo' };
        document.getElementById('from').value = 'Mein Standort';
      });
    };
    document.getElementById('btnLocate').onclick = () => getLocation();

    // ===================== STYLE SWITCHER =====================
    document.getElementById('btnStyle').onclick = () => {
      document.getElementById('styleMenu').classList.toggle('open');
    };
    document.querySelectorAll('.style-opt').forEach(el => {
      el.onclick = () => {
        document.querySelectorAll('.style-opt').forEach(o => o.classList.remove('active'));
        el.classList.add('active');
        map.removeLayer(baseLayer);
        baseLayer = styles[el.dataset.style].addTo(map);
        document.getElementById('styleMenu').classList.remove('open');
      };
    });

    // ===================== MODES & SWAP =====================
    document.querySelectorAll('.mode').forEach(el => {
      el.onclick = () => {
        document.querySelectorAll('.mode').forEach(m => m.classList.remove('active'));
        el.classList.add('active');
        mode = el.dataset.m;
      };
    });

    document.getElementById('swap').onclick = () => {
      const a = fromP, b = toP;
      fromP = b; toP = a;
      document.getElementById('from').value = fromP ? fromP.name : '';
      document.getElementById('to').value = toP ? toP.name : '';
    };

    // ===================== ROUTING =====================
    async function calc() {
      if (!fromP || !toP) return alert('Bitte Start und Ziel wählen');
      clearRoute();
      const sheet = document.getElementById('sheet');
      const content = document.getElementById('sheetContent');
      content.innerHTML = `<div class="msg">Route wird berechnet…</div>`;
      sheet.classList.add('open');

      mark(fromP.lat, fromP.lon, '#22c55e');
      mark(toP.lat, toP.lon, '#ef4444');

      try {
        if (mode === 'transit') await doTransit();
        else await doOSRM();
      } catch (err) {
        content.innerHTML = `<div class="msg">Fehler: ${err.message || 'Route nicht möglich'}</div>`;
      }
    }

    async function doTransit() {
      const content = document.getElementById('sheetContent');
      if (!fromP.id || !toP.id) {
        content.innerHTML = `<div class="msg">Für ÖPNV bitte Haltestellen aus der Suche wählen</div>`;
        // fallback line
        routeLayer = L.polyline([[fromP.lat, fromP.lon], [toP.lat, toP.lon]], {
          color: '#4f8cff', weight: 5, dashArray: '8 8'
        }).addTo(map);
        map.fitBounds(routeLayer.getBounds(), { padding: [60, 60] });
        return;
      }

      const url = `https://www.mvg.de/api/bgw-pt/v3/routes?originStationGlobalId=${encodeURIComponent(fromP.id)}&destinationStationGlobalId=${encodeURIComponent(toP.id)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('MVG nicht erreichbar');
      const data = await res.json();
      const routes = Array.isArray(data) ? data : (data.routes || data.connections || []);

      if (!routes.length) {
        content.innerHTML = `<div class="msg">Keine ÖPNV-Verbindung gefunden</div>`;
        return;
      }

      let html = '';
      routes.slice(0, 4).forEach((r, i) => {
        const dur = r.duration || r.travelTime || '–';
        const legs = r.legs || r.parts || [];
        let legH = '';
        legs.forEach(l => {
          const lab = l.label || l.line || l.transportType || 'Fuß';
          const t = (l.transportType || l.product || lab + '').toUpperCase();
          let c = 'walk';
          if (t.includes('U')) c = 'u';
          else if (t.includes('S')) c = 's';
          else if (t.includes('TRAM')) c = 'tram';
          else if (t.includes('BUS')) c = 'bus';
          legH += `<span class="leg ${c}">${lab}</span>`;
        });
        if (!legH) legH = `<span class="leg walk">ÖPNV</span>`;

        html += `
          <div class="route-item">
            <div class="dur">${typeof dur === 'number' ? dur + ' min' : dur}</div>
            <div class="info">Verbindung ${i + 1}</div>
            <div class="legs">${legH}</div>
          </div>`;
      });
      content.innerHTML = html;

      routeLayer = L.polyline([[fromP.lat, fromP.lon], [toP.lat, toP.lon]], {
        color: '#4f8cff', weight: 5, opacity: 0.85
      }).addTo(map);
      map.fitBounds(routeLayer.getBounds(), { padding: [70, 70] });
    }

    async function doOSRM() {
      const content = document.getElementById('sheetContent');
      const profile = mode === 'car' ? 'driving' : mode === 'bike' ? 'cycling' : 'foot';
      const url = `https://router.project-osrm.org/route/v1/${profile}/${fromP.lon},${fromP.lat};${toP.lon},${toP.lat}?overview=full&geometries=geojson`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.code !== 'Ok' || !data.routes?.length) throw new Error('Keine Route gefunden');

      const r = data.routes[0];
      const mins = Math.round(r.duration / 60);
      const km = (r.distance / 1000).toFixed(1);
      const label = mode === 'car' ? 'Auto' : mode === 'bike' ? 'Fahrrad' : 'Zu Fuß';
      const cls = mode === 'car' ? 'car' : mode === 'bike' ? 'bike' : 'walk';

      content.innerHTML = `
        <div class="route-item">
          <div class="dur">${mins} min</div>
          <div class="info">${km} km · ${label}</div>
          <div class="legs"><span class="leg ${cls}">${label}</span></div>
        </div>`;

      const coords = r.geometry.coordinates.map(c => [c[1], c[0]]);
      routeLayer = L.polyline(coords, {
        color: mode === 'car' ? '#3b82f6' : mode === 'bike' ? '#10b981' : '#94a3b8',
        weight: 6, opacity: 0.9
      }).addTo(map);
      map.fitBounds(routeLayer.getBounds(), { padding: [60, 60] });
    }

    document.getElementById('go').onclick = calc;

    // Click outside to close menus
    document.addEventListener('click', e => {
      if (!e.target.closest('#btnStyle') && !e.target.closest('#styleMenu')) {
        document.getElementById('styleMenu').classList.remove('open');
      }
    });
  </script>
</body>
</html>
