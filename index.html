<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ÖPNV Live</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0a0c11;
      --surface: #13171f;
      --surface2: #1a1f2b;
      --border: #2a3142;
      --text: #f0f2f7;
      --muted: #8a93a8;
      --accent: #4f8cff;
      --u: #0065b0;
      --s: #008c4f;
      --tram: #e30613;
      --bus: #f5a623;
      --success: #3dd68c;
      --danger: #ff5c5c;
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
    }

    /* ========== LAYOUT ========== */
    #app {
      display: grid;
      grid-template-columns: 400px 1fr;
      height: 100dvh;
    }

    @media (max-width: 860px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
      }
    }

    /* ========== SIDEBAR / SHEET ========== */
    .panel {
      background: var(--surface);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      z-index: 1000;
      max-height: 100dvh;
    }

    @media (max-width: 860px) {
      .panel {
        border-right: none;
        border-radius: 20px 20px 0 0;
        max-height: 52dvh;
        box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
        order: 2;
      }
      .panel.expanded {
        max-height: 78dvh;
      }
    }

    .panel-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    @media (max-width: 860px) {
      .panel-header {
        padding-top: 8px;
      }
      .handle {
        width: 36px;
        height: 4px;
        background: #3a4358;
        border-radius: 2px;
        margin: 0 auto 10px;
      }
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .panel-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* Search */
    .search-wrap {
      margin-top: 14px;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      height: 46px;
      padding: 0 14px 0 42px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .search-wrap input:focus {
      border-color: var(--accent);
    }

    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      opacity: 0.5;
      pointer-events: none;
    }

    .results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-height: 260px;
      overflow-y: auto;
      display: none;
      z-index: 50;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }

    .results.open { display: block; }

    .result-item {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .result-item:last-child { border-bottom: none; }
    .result-item:active,
    .result-item:hover { background: #222836; }

    .result-item .name { font-weight: 600; font-size: 14px; }
    .result-item .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* Filters */
    .filters {
      display: flex;
      gap: 7px;
      padding: 12px 18px 6px;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar { display: none; }

    .chip {
      flex-shrink: 0;
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: 0.15s;
    }

    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Departures */
    .deps {
      flex: 1;
      overflow-y: auto;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      -webkit-overflow-scrolling: touch;
    }

    .dep {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(42,49,66,0.55);
    }

    .dep:last-child { border-bottom: none; }

    .line-badge {
      width: 52px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: #fff;
    }

    .line-badge.u { background: var(--u); }
    .line-badge.s { background: var(--s); }
    .line-badge.tram { background: var(--tram); }
    .line-badge.bus { background: var(--bus); color: #111; }
    .line-badge.other { background: #4a5368; }

    .dep-info { min-width: 0; }
    .dep-dest {
      font-size: 14.5px;
      font-weight: 550;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dep-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dep-time {
      text-align: right;
      min-width: 52px;
    }

    .dep-time .min {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .dep-time .status {
      font-size: 11px;
      font-weight: 600;
      margin-top: 2px;
    }

    .status.live { color: var(--success); }
    .status.delay { color: var(--danger); }

    .empty, .loading {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========== MAP ========== */
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
      order: 1;
    }

    @media (max-width: 860px) {
      #map {
        height: 100%;
      }
    }

    /* Map floating controls */
    .map-controls {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      right: 14px;
      z-index: 900;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    @media (min-width: 861px) {
      .map-controls {
        top: 18px;
        right: 18px;
      }
    }

    .map-btn {
      width: 44px;
      height: 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      cursor: pointer;
    }

    .map-btn svg {
      width: 20px;
      height: 20px;
    }

    .map-btn:active {
      background: var(--surface2);
    }

    /* Markers */
    .station-marker {
      width: 16px;
      height: 16px;
      background: var(--accent);
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(79,140,255,0.28);
    }

    .user-marker {
      width: 18px;
      height: 18px;
      background: #4f8cff;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(79,140,255,0.3);
    }

    /* Desktop search in panel only, mobile also works */
  </style>
</head>
<body>
  <div id="app">
    <!-- Panel -->
    <aside class="panel" id="panel">
      <div class="panel-header">
        <div class="handle"></div>
        <div class="panel-title" id="station-name">Standort wird ermittelt…</div>
        <div class="panel-sub">
          <span class="live-dot"></span>
          <span id="station-sub">Bitte warten</span>
        </div>

        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input id="search" type="text" placeholder="Haltestelle suchen…" autocomplete="off" />
          <div id="results" class="results"></div>
        </div>
      </div>

      <div class="filters" id="filters">
        <button class="chip active" data-filter="all">Alle</button>
        <button class="chip" data-filter="u">U-Bahn</button>
        <button class="chip" data-filter="s">S-Bahn</button>
        <button class="chip" data-filter="tram">Tram</button>
        <button class="chip" data-filter="bus">Bus</button>
      </div>

      <div class="deps" id="deps">
        <div class="loading">
          <div class="spinner"></div>
          Standort wird geladen…
        </div>
      </div>
    </aside>

    <!-- Map -->
    <div id="map"></div>

    <!-- Map floating buttons -->
    <div class="map-controls">
      <button class="map-btn" id="btn-locate" title="Mein Standort">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ==================== STATE ====================
    let map, stationMarker, userMarker;
    let currentStation = null;
    let allDepartures = [];
    let currentFilter = "all";
    let refreshTimer = null;
    let userLat = null;
    let userLon = null;

    // ==================== MAP ====================
    function initMap() {
      map = L.map("map", {
        zoomControl: false,
        attributionControl: false,
        preferCanvas: true
      }).setView([51.16, 10.45], 6); // grob Deutschland als Start

      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        maxZoom: 19
      }).addTo(map);

      L.control.zoom({ position: "bottomright" }).addTo(map);
    }

    function setUserMarker(lat, lon) {
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.marker([lat, lon], {
        icon: L.divIcon({
          className: "",
          html: '<div class="user-marker"></div>',
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        }),
        zIndexOffset: 900
      }).addTo(map);
    }

    function setStationMarker(lat, lon) {
      if (stationMarker) map.removeLayer(stationMarker);
      stationMarker = L.marker([lat, lon], {
        icon: L.divIcon({
          className: "",
          html: '<div class="station-marker"></div>',
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        }),
        zIndexOffset: 800
      }).addTo(map);
    }

    // ==================== HELPERS ====================
    function getLineType(type, label) {
      const t = (type || "").toUpperCase();
      const l = (label || "").toUpperCase();
      if (t.includes("UBAHN") || l.startsWith("U")) return "u";
      if (t.includes("SBAHN") || l.startsWith("S")) return "s";
      if (t.includes("TRAM")) return "tram";
      if (t.includes("BUS")) return "bus";
      return "other";
    }

    function formatMinutes(ms) {
      const min = Math.round((ms - Date.now()) / 60000);
      if (min <= 0) return "jetzt";
      return min + " min";
    }

    // ==================== API ====================
    async function searchStations(query) {
      const box = document.getElementById("results");
      if (!query || query.length < 2) {
        box.classList.remove("open");
        return;
      }

      try {
        const res = await fetch(
          `https://www.mvg.de/api/bgw-pt/v3/locations?query=${encodeURIComponent(query)}`
        );
        const data = await res.json();
        const list = (Array.isArray(data) ? data : [])
          .filter(x => x.globalId || x.id)
          .slice(0, 8);

        if (!list.length) {
          box.innerHTML = `<div class="result-item"><div class="name">Keine Treffer</div></div>`;
          box.classList.add("open");
          return;
        }

        box.innerHTML = list.map(s => `
          <div class="result-item"
               data-id="${s.globalId || s.id}"
               data-name="${s.name}"
               data-lat="${s.latitude}"
               data-lon="${s.longitude}"
               data-place="${s.place || ""}">
            <div class="name">${s.name}</div>
            <div class="meta">${s.place || ""}</div>
          </div>
        `).join("");

        box.classList.add("open");

        box.querySelectorAll(".result-item").forEach(el => {
          el.onclick = () => {
            selectStation({
              id: el.dataset.id,
              name: el.dataset.name,
              lat: parseFloat(el.dataset.lat),
              lon: parseFloat(el.dataset.lon),
              place: el.dataset.place
            });
            box.classList.remove("open");
            document.getElementById("search").value = el.dataset.name;
          };
        });
      } catch (err) {
        box.innerHTML = `<div class="result-item"><div class="name">Fehler bei der Suche</div><div class="meta">Netzwerk / CORS</div></div>`;
        box.classList.add("open");
      }
    }

    async function loadDepartures(station) {
      const depsEl = document.getElementById("deps");
      document.getElementById("station-name").textContent = station.name;
      document.getElementById("station-sub").textContent = station.place ? station.place + " · Live" : "Live-Abfahrten";

      depsEl.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          Lade Abfahrten…
        </div>
      `;

      try {
        let res = await fetch(
          `https://www.mvg.de/api/bgw-pt/v3/departures?globalId=${encodeURIComponent(station.id)}`
        );
        if (!res.ok) {
          res = await fetch(
            `https://www.mvg.de/api/fib/v2/departure?globalId=${encodeURIComponent(station.id)}`
          );
        }

        const data = await res.json();
        allDepartures = Array.isArray(data) ? data : (data.departures || []);
        renderDepartures();
      } catch (err) {
        console.error(err);
        depsEl.innerHTML = `
          <div class="empty">
            Abfahrten konnten nicht geladen werden.<br>
            <small style="opacity:0.7">API nicht erreichbar (CORS)</small>
          </div>
        `;
      }
    }

    function renderDepartures() {
      const depsEl = document.getElementById("deps");
      let list = allDepartures;

      if (currentFilter !== "all") {
        list = list.filter(d => {
          const type = getLineType(d.transportType || d.product, d.label || d.line);
          return type === currentFilter;
        });
      }

      if (!list.length) {
        depsEl.innerHTML = `<div class="empty">Keine Abfahrten für diesen Filter</div>`;
        return;
      }

      const now = Date.now();
      let html = "";

      list.slice(0, 25).forEach(d => {
        const label = d.label || d.line || "?";
        const dest = d.destination || d.direction || "–";
        const type = getLineType(d.transportType || d.product, label);
        const rt = d.realtimeDepartureTime || d.departureTime || now;
        const delay = d.delayInMinutes || 0;
        const platform = d.platform || "";
        const isLive = !!d.realtime;

        let status = "";
        if (delay > 0) status = `<div class="status delay">+${delay} min</div>`;
        else if (isLive) status = `<div class="status live">LIVE</div>`;

        html += `
          <div class="dep">
            <div class="line-badge ${type}">${label}</div>
            <div class="dep-info">
              <div class="dep-dest">${dest}</div>
              <div class="dep-meta">
                ${platform ? `<span>Gl. ${platform}</span>` : ""}
                ${d.cancelled ? `<span style="color:var(--danger)">entfällt</span>` : ""}
              </div>
            </div>
            <div class="dep-time">
              <div class="min">${formatMinutes(rt)}</div>
              ${status}
            </div>
          </div>
        `;
      });

      depsEl.innerHTML = html;
    }

    // ==================== STATION ====================
    function selectStation(station) {
      currentStation = station;
      setStationMarker(station.lat, station.lon);
      map.flyTo([station.lat, station.lon], 15.5, { duration: 0.9 });

      loadDepartures(station);

      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(() => loadDepartures(station), 30000);
    }

    // ==================== GEOLOCATION ====================
    function locateUser(showError = true) {
      if (!navigator.geolocation) {
        if (showError) alert("Standort wird von diesem Gerät nicht unterstützt.");
        fallbackMunich();
        return;
      }

      document.getElementById("station-name").textContent = "Standort wird ermittelt…";
      document.getElementById("station-sub").textContent = "Bitte warten";
      document.getElementById("deps").innerHTML = `
        <div class="loading"><div class="spinner"></div>Standort wird geladen…</div>
      `;

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          userLat = pos.coords.latitude;
          userLon = pos.coords.longitude;

          setUserMarker(userLat, userLon);
          map.setView([userLat, userLon], 14);

          // Versuche nahe Haltestelle über die MVG-API zu finden
          try {
            // Die Locations-API akzeptiert manchmal Koordinaten nicht direkt.
            // Deshalb nutzen wir eine einfache Suche + nächste Station manuell.
            // Für den Start: wir setzen den View und lassen den User suchen
            // oder wir versuchen eine generische Nearby-Abfrage.

            // Fallback: Zeige Standort und warte auf Auswahl
            document.getElementById("station-name").textContent = "Dein Standort";
            document.getElementById("station-sub").textContent = "Haltestelle suchen oder tippen";
            document.getElementById("deps").innerHTML = `
              <div class="empty">
                Standort gefunden.<br>
                Suche eine Haltestelle oder nutze die Suche oben.
              </div>
            `;
          } catch (e) {
            console.log(e);
          }
        },
        (err) => {
          console.warn(err);
          if (showError) {
            document.getElementById("station-name").textContent = "Standort nicht verfügbar";
            document.getElementById("station-sub").textContent = "Suche eine Haltestelle";
            document.getElementById("deps").innerHTML = `
              <div class="empty">
                Standort konnte nicht ermittelt werden.<br>
                Bitte erlaube den Standortzugriff oder suche manuell.
              </div>
            `;
          }
          // grober Deutschland-View bleibt
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
      );
    }

    function fallbackMunich() {
      // nur als allerletzter Fallback
      selectStation({
        id: "de:09162:2",
        name: "Marienplatz",
        lat: 48.13725,
        lon: 11.57542,
        place: "München"
      });
    }

    // ==================== EVENTS ====================
    let searchTimeout;
    document.getElementById("search").addEventListener("input", (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => searchStations(e.target.value.trim()), 240);
    });

    document.getElementById("btn-locate").addEventListener("click", () => locateUser(true));

    document.getElementById("filters").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      currentFilter = chip.dataset.filter;
      renderDepartures();
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-wrap")) {
        document.getElementById("results").classList.remove("open");
      }
    });

    // ==================== START ====================
    initMap();
    locateUser(false);
  </script>
</body>
</html>
