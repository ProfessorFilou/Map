<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MVV Live Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --panel-border: #2a2f3d;
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --accent: #4f8cff;
      --u: #0065b0;
      --s: #008c4f;
      --tram: #e30613;
      --bus: #f5a623;
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    #app {
      display: grid;
      grid-template-columns: 380px 1fr;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--panel-border);
    }

    .header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 span {
      background: linear-gradient(135deg, #4f8cff, #7b5cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-box {
      margin-top: 14px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: #12151e;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      opacity: 0.5;
    }

    .results {
      max-height: 220px;
      overflow-y: auto;
      border-bottom: 1px solid var(--panel-border);
    }

    .result-item {
      padding: 12px 20px;
      cursor: pointer;
      border-bottom: 1px solid #1f2330;
      transition: background 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-item:hover {
      background: #222633;
    }

    .result-item .name {
      font-weight: 500;
    }

    .result-item .place {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Departures Panel */
    .departures-panel {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
    }

    .station-title {
      padding: 0 20px 12px;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .departure {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 1px solid #1c2030;
    }

    .line-badge {
      width: 48px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: white;
    }

    .line-u { background: var(--u); }
    .line-s { background: var(--s); }
    .line-tram { background: var(--tram); }
    .line-bus { background: var(--bus); color: #111; }
    .line-other { background: #555; }

    .dest {
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .time .min {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .time .live {
      font-size: 0.7rem;
      color: #3dd68c;
      font-weight: 600;
    }

    .time .delay {
      font-size: 0.7rem;
      color: #ff6b6b;
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Map */
    #map {
      width: 100%;
      height: 100%;
      background: #1a1d27;
    }

    /* Custom Marker */
    .station-marker {
      background: var(--panel);
      border: 2px solid var(--accent);
      border-radius: 50%;
      width: 18px;
      height: 18px;
      box-shadow: 0 0 0 4px rgba(79, 140, 255, 0.25);
    }

    /* Mobile */
    @media (max-width: 800px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: 45% 55%;
      }
      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--panel-border);
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="header">
        <h1><span>MVV</span> Live Map</h1>
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input id="search" type="text" placeholder="Haltestelle suchen..." autocomplete="off" />
        </div>
      </div>

      <div id="results" class="results"></div>

      <div class="departures-panel" id="departures">
        <div class="empty">
          Haltestelle suchen oder auf der Karte auswählen
        </div>
      </div>
    </aside>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ========== MAP ==========
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([48.137, 11.575], 13);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    let currentMarker = null;
    let currentStationId = null;
    let refreshTimer = null;

    // ========== ICONS ==========
    function getLineClass(type) {
      if (!type) return 'line-other';
      const t = type.toUpperCase();
      if (t.includes('U') || t === 'UBAHN') return 'line-u';
      if (t.includes('S') || t === 'SBAHN') return 'line-s';
      if (t.includes('TRAM') || t === 'TRAM') return 'line-tram';
      if (t.includes('BUS') || t === 'BUS') return 'line-bus';
      return 'line-other';
    }

    // ========== API ==========
    // Aktuelle MVG API (kann sich ändern)
    const API_BASE = 'https://www.mvg.de/api/bgw-pt/v3';

    async function searchStations(query) {
      if (!query || query.length < 2) {
        document.getElementById('results').innerHTML = '';
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/locations?query=${encodeURIComponent(query)}`);
        const data = await res.json();
        const stations = (Array.isArray(data) ? data : data.locations || [])
          .filter(l => l.type === 'station' || l.globalId || l.id)
          .slice(0, 8);

        const resultsEl = document.getElementById('results');
        resultsEl.innerHTML = stations.map(s => {
          const name = s.name || s.title || 'Unbekannt';
          const place = s.place || s.city || '';
          const id = s.globalId || s.id;
          const lat = s.latitude || s.lat;
          const lon = s.longitude || s.lon;
          return `
            <div class="result-item" data-id="${id}" data-lat="${lat}" data-lon="${lon}" data-name="${name}">
              <div>
                <div class="name">${name}</div>
                <div class="place">${place}</div>
              </div>
            </div>
          `;
        }).join('');

        resultsEl.querySelectorAll('.result-item').forEach(el => {
          el.addEventListener('click', () => {
            const id = el.dataset.id;
            const lat = parseFloat(el.dataset.lat);
            const lon = parseFloat(el.dataset.lon);
            const name = el.dataset.name;
            selectStation(id, name, lat, lon);
            document.getElementById('results').innerHTML = '';
            document.getElementById('search').value = name;
          });
        });
      } catch (err) {
        console.error('Suche fehlgeschlagen:', err);
        document.getElementById('results').innerHTML = `
          <div class="empty" style="padding:16px;font-size:0.85rem">
            API nicht erreichbar (CORS). Am besten lokal hosten.
          </div>`;
      }
    }

    async function loadDepartures(stationId, stationName) {
      const panel = document.getElementById('departures');
      panel.innerHTML = `<div class="station-title">${stationName}</div><div class="empty">Lade Abfahrten…</div>`;

      try {
        // Versuch 1: neuer Endpoint
        let res = await fetch(`${API_BASE}/departures?globalId=${encodeURIComponent(stationId)}`);
        if (!res.ok) {
          // Fallback ältere Variante
          res = await fetch(`https://www.mvg.de/api/fib/v2/departure?globalId=${encodeURIComponent(stationId)}`);
        }
        const data = await res.json();
        const deps = Array.isArray(data) ? data : (data.departures || []);

        if (!deps.length) {
          panel.innerHTML = `<div class="station-title">${stationName}</div><div class="empty">Keine Abfahrten gefunden</div>`;
          return;
        }

        const now = Date.now();
        let html = `<div class="station-title">${stationName}</div>`;

        deps.slice(0, 18).forEach(d => {
          const label = d.label || d.line || d.transportType || '?';
          const dest = d.destination || d.direction || '–';
          const type = d.transportType || d.product || '';
          const realtime = d.realtimeDepartureTime || d.realtimeTime || d.departureTime;
          const planned = d.plannedDepartureTime || d.plannedTime || realtime;
          const delay = d.delayInMinutes;

          let minutes = Math.round((realtime - now) / 60000);
          if (minutes < 0) minutes = 0;

          const timeText = minutes === 0 ? 'jetzt' : `${minutes} min`;
          const liveBadge = d.realtime ? '<div class="live">LIVE</div>' : '';
          const delayBadge = (delay && delay > 0) ? `<div class="delay">+${delay} min</div>` : '';

          html += `
            <div class="departure">
              <div class="line-badge ${getLineClass(type)}">${label}</div>
              <div class="dest">${dest}</div>
              <div class="time">
                <div class="min">${timeText}</div>
                ${liveBadge}${delayBadge}
              </div>
            </div>
          `;
        });

        panel.innerHTML = html;
      } catch (err) {
        console.error(err);
        panel.innerHTML = `
          <div class="station-title">${stationName}</div>
          <div class="empty">
            Abfahrten konnten nicht geladen werden.<br>
            <small style="opacity:0.7">CORS oder API-Änderung</small>
          </div>`;
      }
    }

    function selectStation(id, name, lat, lon) {
      currentStationId = id;

      if (currentMarker) map.removeLayer(currentMarker);

      currentMarker = L.marker([lat, lon], {
        icon: L.divIcon({
          className: '',
          html: '<div class="station-marker"></div>',
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        })
      }).addTo(map);

      map.flyTo([lat, lon], 16, { duration: 0.8 });

      loadDepartures(id, name);

      // Auto-Refresh alle 30 Sekunden
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(() => loadDepartures(id, name), 30000);
    }

    // Search debounce
    let searchTimeout;
    document.getElementById('search').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => searchStations(e.target.value.trim()), 280);
    });

    // Start with Marienplatz as example
    setTimeout(() => {
      selectStation('de:09162:2', 'Marienplatz', 48.13725, 11.57542);
    }, 600);
  </script>
</body>
</html>
