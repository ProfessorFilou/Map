<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ÖPNV Live</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0b0d13;
      --panel: #12151d;
      --card: #1a1e28;
      --border: #2a3142;
      --text: #f1f3f8;
      --muted: #8b93a7;
      --accent: #4f8cff;
      --u: #0065b0;
      --s: #008c4f;
      --tram: #e30613;
      --bus: #f5a623;
      --green: #34d399;
      --red: #f87171;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
    }

    #app {
      display: grid;
      grid-template-columns: 420px 1fr;
      height: 100dvh;
    }

    @media (max-width: 900px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
      }
    }

    /* PANEL */
    .panel {
      background: var(--panel);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      z-index: 1000;
      max-height: 100dvh;
      overflow: hidden;
    }

    @media (max-width: 900px) {
      .panel {
        border-right: none;
        border-radius: 22px 22px 0 0;
        max-height: 48dvh;
        box-shadow: 0 -12px 40px rgba(0,0,0,.5);
        order: 2;
      }
    }

    .panel-top {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    @media (max-width: 900px) {
      .handle {
        width: 40px;
        height: 4px;
        background: #3a4358;
        border-radius: 2px;
        margin: 0 auto 12px;
      }
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: .35; }
    }

    .search {
      margin-top: 12px;
      position: relative;
    }

    .search input {
      width: 100%;
      height: 44px;
      padding: 0 12px 0 40px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .search input:focus { border-color: var(--accent); }

    .search svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      opacity: .5;
      pointer-events: none;
    }

    .results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0; right: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-height: 280px;
      overflow-y: auto;
      display: none;
      z-index: 50;
      box-shadow: 0 12px 32px rgba(0,0,0,.4);
    }

    .results.open { display: block; }

    .result {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .result:last-child { border-bottom: none; }
    .result:hover, .result:active { background: #222836; }
    .result .name { font-weight: 600; font-size: 14px; }
    .result .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .filters {
      display: flex;
      gap: 6px;
      padding: 10px 16px 6px;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar { display: none; }

    .chip {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
    }

    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .list {
      flex: 1;
      overflow-y: auto;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    .dep {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 11px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(42,49,66,.5);
    }

    .dep:last-child { border-bottom: none; }

    .badge {
      width: 50px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      color: #fff;
    }

    .badge.u { background: var(--u); }
    .badge.s { background: var(--s); }
    .badge.tram { background: var(--tram); }
    .badge.bus { background: var(--bus); color: #111; }
    .badge.other { background: #4a5368; }

    .info { min-width: 0; }
    .dest {
      font-size: 14px;
      font-weight: 550;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      display: flex;
      gap: 8px;
    }

    .time {
      text-align: right;
      min-width: 50px;
    }

    .time .min {
      font-size: 14.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .time .status {
      font-size: 11px;
      font-weight: 600;
      margin-top: 1px;
    }

    .status.live { color: var(--green); }
    .status.delay { color: var(--red); }

    .empty, .loading {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* MAP */
    #map {
      width: 100%;
      height: 100%;
      order: 1;
      background: #0d1118;
    }

    .map-btns {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      z-index: 900;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .map-btn {
      width: 44px;
      height: 44px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      box-shadow: 0 4px 16px rgba(0,0,0,.35);
      cursor: pointer;
    }

    .map-btn:active { background: var(--card); }
    .map-btn svg { width: 18px; height: 18px; }

    .station-dot {
      width: 12px;
      height: 12px;
      background: var(--accent);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(79,140,255,.2);
      cursor: pointer;
    }

    .station-dot.active {
      width: 16px;
      height: 16px;
      background: #fff;
      border: 3px solid var(--accent);
      box-shadow: 0 0 0 5px rgba(79,140,255,.3);
    }

    .user-dot {
      width: 16px;
      height: 16px;
      background: #4f8cff;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(79,140,255,.25);
    }

    .leaflet-popup-content-wrapper {
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }

    .leaflet-popup-tip { background: var(--card); }
    .leaflet-popup-content {
      margin: 9px 11px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="app">
    <aside class="panel">
      <div class="panel-top">
        <div class="handle"></div>
        <div class="title" id="title">Standort wird ermittelt…</div>
        <div class="subtitle">
          <span class="dot"></span>
          <span id="subtitle">Bitte warten</span>
        </div>

        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input id="search" type="text" placeholder="Haltestelle suchen…" autocomplete="off" />
          <div id="results" class="results"></div>
        </div>
      </div>

      <div class="filters" id="filters">
        <button class="chip active" data-f="all">Alle</button>
        <button class="chip" data-f="u">U-Bahn</button>
        <button class="chip" data-f="s">S-Bahn</button>
        <button class="chip" data-f="tram">Tram</button>
        <button class="chip" data-f="bus">Bus</button>
      </div>

      <div class="list" id="list">
        <div class="loading"><div class="spinner"></div>Standort wird geladen…</div>
      </div>
    </aside>

    <div id="map"></div>

    <div class="map-btns">
      <button class="map-btn" id="locate" title="Mein Standort">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, userMarker;
    let markers = [];
    let current = null;
    let deps = [];
    let filter = "all";
    let timer = null;
    let lat = null, lon = null;

    function init() {
      map = L.map("map", {
        zoomControl: false,
        attributionControl: false,
        preferCanvas: true
      }).setView([51.16, 10.45], 6);

      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        maxZoom: 19
      }).addTo(map);

      L.control.zoom({ position: "bottomright" }).addTo(map);
    }

    function clearMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
    }

    function addMarker(s, active = false) {
      const icon = L.divIcon({
        className: "",
        html: `<div class="station-dot ${active ? "active" : ""}"></div>`,
        iconSize: active ? [16,16] : [12,12],
        iconAnchor: active ? [8,8] : [6,6]
      });

      const m = L.marker([s.lat, s.lon], {
        icon,
        zIndexOffset: active ? 900 : 500
      }).addTo(map);

      const dist = s.dist != null
        ? (s.dist < 1000 ? Math.round(s.dist) + " m" : (s.dist/1000).toFixed(1) + " km")
        : "";

      m.bindPopup(`<b>${s.name}</b>${s.place ? "<br>"+s.place : ""}${dist ? "<br>"+dist : ""}`);
      m.on("click", () => select(s));
      markers.push(m);
    }

    function setUser(lat, lon) {
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.marker([lat, lon], {
        icon: L.divIcon({
          className: "",
          html: '<div class="user-dot"></div>',
          iconSize: [16,16],
          iconAnchor: [8,8]
        }),
        zIndexOffset: 1000
      }).addTo(map);
    }

    function typeOf(t, label) {
      const a = (t||"").toUpperCase();
      const b = (label||"").toUpperCase();
      if (a.includes("UBAHN") || b.startsWith("U")) return "u";
      if (a.includes("SBAHN") || b.startsWith("S")) return "s";
      if (a.includes("TRAM")) return "tram";
      if (a.includes("BUS")) return "bus";
      return "other";
    }

    function mins(ms) {
      const m = Math.round((ms - Date.now()) / 60000);
      return m <= 0 ? "jetzt" : m + " min";
    }

    function dist(a,b,c,d) {
      const R = 6371e3;
      const p1 = a * Math.PI/180, p2 = c * Math.PI/180;
      const dp = (c-a)*Math.PI/180, dl = (d-b)*Math.PI/180;
      const x = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
    }

    async function search(q) {
      const box = document.getElementById("results");
      if (!q || q.length < 2) {
        box.classList.remove("open");
        return;
      }

      try {
        const res = await fetch(`https://www.mvg.de/api/bgw-pt/v3/locations?query=${encodeURIComponent(q)}`);
        const data = await res.json();
        const list = (Array.isArray(data) ? data : []).filter(x => x.globalId || x.id).slice(0, 10);

        if (!list.length) {
          box.innerHTML = `<div class="result"><div class="name">Keine Treffer</div></div>`;
          box.classList.add("open");
          return;
        }

        box.innerHTML = list.map(s => `
          <div class="result"
               data-id="${s.globalId||s.id}"
               data-name="${s.name}"
               data-lat="${s.latitude}"
               data-lon="${s.longitude}"
               data-place="${s.place||""}">
            <div class="name">${s.name}</div>
            <div class="meta">${s.place||""}</div>
          </div>
        `).join("");

        box.classList.add("open");

        box.querySelectorAll(".result").forEach(el => {
          el.onclick = () => {
            select({
              id: el.dataset.id,
              name: el.dataset.name,
              lat: +el.dataset.lat,
              lon: +el.dataset.lon,
              place: el.dataset.place
            });
            box.classList.remove("open");
            document.getElementById("search").value = el.dataset.name;
          };
        });
      } catch {
        box.innerHTML = `<div class="result"><div class="name">Suchfehler</div><div class="meta">Netzwerk / CORS</div></div>`;
        box.classList.add("open");
      }
    }

    async function nearby(lat, lon) {
      const queries = ["Bahnhof","Hauptbahnhof","Zentrum","Platz","Straße","Markt","U-Bahn","S-Bahn","Haltestelle","Marienplatz"];
      let all = [];

      try {
        const reqs = queries.map(q =>
          fetch(`https://www.mvg.de/api/bgw-pt/v3/locations?query=${encodeURIComponent(q)}`)
            .then(r => r.json())
            .then(d => Array.isArray(d) ? d : [])
            .catch(() => [])
        );

        const results = await Promise.all(reqs);
        results.forEach(list => all.push(...list));

        const seen = new Set();
        all = all.filter(s => {
          const id = s.globalId || s.id;
          if (!id || !s.latitude || !s.longitude || seen.has(id)) return false;
          seen.add(id);
          return true;
        });

        return all
          .map(s => ({
            id: s.globalId || s.id,
            name: s.name,
            lat: s.latitude,
            lon: s.longitude,
            place: s.place || "",
            dist: dist(lat, lon, s.latitude, s.longitude)
          }))
          .filter(s => s.dist < 15000)
          .sort((a,b) => a.dist - b.dist)
          .slice(0, 30);
      } catch {
        return [];
      }
    }

    async function loadDeps(s) {
      const list = document.getElementById("list");
      document.getElementById("title").textContent = s.name;

      let sub = "Live-Abfahrten";
      if (s.place) sub = s.place + " · Live";
      if (s.dist != null) {
        const d = s.dist < 1000 ? Math.round(s.dist) + " m" : (s.dist/1000).toFixed(1) + " km";
        sub = d + " · " + sub;
      }
      document.getElementById("subtitle").textContent = sub;

      list.innerHTML = `<div class="loading"><div class="spinner"></div>Lade Abfahrten…</div>`;

      try {
        let res = await fetch(`https://www.mvg.de/api/bgw-pt/v3/departures?globalId=${encodeURIComponent(s.id)}`);
        if (!res.ok) res = await fetch(`https://www.mvg.de/api/fib/v2/departure?globalId=${encodeURIComponent(s.id)}`);

        const data = await res.json();
        deps = Array.isArray(data) ? data : (data.departures || []);
        render();
      } catch {
        list.innerHTML = `<div class="empty">Abfahrten nicht ladbar<br><small style="opacity:.7">CORS / API</small></div>`;
      }
    }

    function render() {
      const list = document.getElementById("list");
      let items = deps;

      if (filter !== "all") {
        items = items.filter(d => typeOf(d.transportType || d.product, d.label || d.line) === filter);
      }

      if (!items.length) {
        list.innerHTML = `<div class="empty">Keine Abfahrten für diesen Filter</div>`;
        return;
      }

      const now = Date.now();
      let html = "";

      items.slice(0, 40).forEach(d => {
        const label = d.label || d.line || "?";
        const dest = d.destination || d.direction || "–";
        const t = typeOf(d.transportType || d.product, label);
        const rt = d.realtimeDepartureTime || d.departureTime || now;
        const delay = d.delayInMinutes || 0;
        const platform = d.platform || "";
        const live = !!d.realtime;

        let status = "";
        if (delay > 0) status = `<div class="status delay">+${delay} min</div>`;
        else if (live) status = `<div class="status live">LIVE</div>`;

        html += `
          <div class="dep">
            <div class="badge ${t}">${label}</div>
            <div class="info">
              <div class="dest">${dest}</div>
              <div class="meta">
                ${platform ? `<span>Gl. ${platform}</span>` : ""}
                ${d.cancelled ? `<span style="color:var(--red)">entfällt</span>` : ""}
              </div>
            </div>
            <div class="time">
              <div class="min">${mins(rt)}</div>
              ${status}
            </div>
          </div>
        `;
      });

      list.innerHTML = html;
    }

    function select(s) {
      current = s;
      clearMarkers();
      addMarker(s, true);
      map.flyTo([s.lat, s.lon], 15.5, { duration: .8 });
      loadDeps(s);

      if (timer) clearInterval(timer);
      timer = setInterval(() => loadDeps(s), 30000);
    }

    function locate() {
      if (!navigator.geolocation) {
        document.getElementById("title").textContent = "Standort nicht verfügbar";
        document.getElementById("subtitle").textContent = "Bitte suchen";
        document.getElementById("list").innerHTML = `<div class="empty">Standortzugriff wird nicht unterstützt</div>`;
        return;
      }

      document.getElementById("title").textContent = "Standort wird ermittelt…";
      document.getElementById("subtitle").textContent = "Bitte warten";
      document.getElementById("list").innerHTML = `<div class="loading"><div class="spinner"></div>Standort wird geladen…</div>`;

      navigator.geolocation.getCurrentPosition(
        async pos => {
          lat = pos.coords.latitude;
          lon = pos.coords.longitude;
          setUser(lat, lon);
          map.setView([lat, lon], 14);

          const near = await nearby(lat, lon);
          clearMarkers();
          near.forEach((s, i) => addMarker(s, i === 0));

          if (near.length) select(near[0]);
          else {
            document.getElementById("title").textContent = "Dein Standort";
            document.getElementById("subtitle").textContent = "Keine Haltestellen gefunden";
            document.getElementById("list").innerHTML = `<div class="empty">Standort gefunden.<br>Suche manuell eine Haltestelle.</div>`;
          }
        },
        () => {
          document.getElementById("title").textContent = "Standort blockiert";
          document.getElementById("subtitle").textContent = "Zugriff erlauben oder suchen";
          document.getElementById("list").innerHTML = `<div class="empty">Standort konnte nicht ermittelt werden</div>`;
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 }
      );
    }

    // events
    let t;
    document.getElementById("search").addEventListener("input", e => {
      clearTimeout(t);
      t = setTimeout(() => search(e.target.value.trim()), 220);
    });

    document.getElementById("locate").onclick = locate;

    document.getElementById("filters").onclick = e => {
      const c = e.target.closest(".chip");
      if (!c) return;
      document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
      c.classList.add("active");
      filter = c.dataset.f;
      render();
    };

    document.addEventListener("click", e => {
      if (!e.target.closest(".search")) document.getElementById("results").classList.remove("open");
    });

    init();
    locate();
  </script>
</body>
</html>
