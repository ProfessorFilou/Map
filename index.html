<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MVV ÖPNV</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0c0e14;
      --surface: #151922;
      --surface2: #1c212d;
      --border: #2a3142;
      --text: #f1f3f7;
      --muted: #8b93a8;
      --accent: #4f8cff;
      --u: #0065b0;
      --s: #008c4f;
      --tram: #e30613;
      --bus: #f5a623;
      --success: #3dd68c;
      --danger: #ff5c5c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
    }

    /* ========== MAP ========== */
    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* ========== TOP BAR ========== */
    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: max(12px, env(safe-area-inset-top)) 14px 0;
      background: linear-gradient(to bottom, rgba(12,14,20,0.97) 55%, transparent);
      pointer-events: none;
    }

    .topbar-inner {
      pointer-events: auto;
      display: flex;
      gap: 10px;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-box input {
      width: 100%;
      height: 48px;
      padding: 0 16px 0 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 16px;
      outline: none;
      box-shadow: 0 4px 24px rgba(0,0,0,0.35);
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    .search-box svg {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      opacity: 0.55;
      pointer-events: none;
    }

    .btn-nearby {
      width: 48px;
      height: 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      box-shadow: 0 4px 24px rgba(0,0,0,0.35);
      flex-shrink: 0;
    }

    .btn-nearby svg {
      width: 20px;
      height: 20px;
    }

    /* Results Dropdown */
    .results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-height: 280px;
      overflow-y: auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      display: none;
      z-index: 20;
    }

    .results.open {
      display: block;
    }

    .result-item {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item:active {
      background: var(--surface2);
    }

    .result-item .name {
      font-weight: 600;
      font-size: 15px;
    }

    .result-item .meta {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ========== BOTTOM SHEET ========== */
    .sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.45);
      max-height: 52%;
      display: flex;
      flex-direction: column;
      transition: max-height 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .sheet.expanded {
      max-height: 78%;
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: #3a4358;
      border-radius: 2px;
      margin: 10px auto 4px;
      flex-shrink: 0;
    }

    .sheet-header {
      padding: 6px 18px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sheet-header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .sheet-header .sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Filter Chips */
    .filters {
      display: flex;
      gap: 8px;
      padding: 12px 18px 4px;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* Departures List */
    .deps {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0 max(24px, env(safe-area-inset-bottom));
      -webkit-overflow-scrolling: touch;
    }

    .dep {
      display: grid;
      grid-template-columns: 58px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(42,49,66,0.6);
    }

    .dep:last-child {
      border-bottom: none;
    }

    .line-badge {
      width: 54px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .line-badge.u { background: var(--u); }
    .line-badge.s { background: var(--s); }
    .line-badge.tram { background: var(--tram); }
    .line-badge.bus { background: var(--bus); color: #111; }
    .line-badge.other { background: #4a5368; }

    .dep-info {
      min-width: 0;
    }

    .dep-dest {
      font-size: 15px;
      font-weight: 550;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dep-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dep-time {
      text-align: right;
      min-width: 54px;
    }

    .dep-time .min {
      font-size: 16px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .dep-time .status {
      font-size: 11px;
      font-weight: 600;
      margin-top: 2px;
    }

    .dep-time .status.live {
      color: var(--success);
    }

    .dep-time .status.delay {
      color: var(--danger);
    }

    .empty-state {
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    /* Station Marker */
    .station-marker {
      width: 16px;
      height: 16px;
      background: var(--accent);
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(79,140,255,0.25);
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 40px;
      color: var(--muted);
      font-size: 14px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Top Search -->
  <div class="topbar">
    <div class="topbar-inner">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="search" type="text" placeholder="Haltestelle suchen…" autocomplete="off" />
        <div id="results" class="results"></div>
      </div>
      <button class="btn-nearby" id="btn-nearby" title="In der Nähe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z"/>
          <circle cx="12" cy="9" r="2.5"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Bottom Sheet -->
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>

    <div class="sheet-header">
      <h1 id="station-name">Marienplatz</h1>
      <div class="sub">
        <span class="live-dot"></span>
        <span id="station-sub">Live-Abfahrten</span>
      </div>
    </div>

    <div class="filters" id="filters">
      <button class="chip active" data-filter="all">Alle</button>
      <button class="chip" data-filter="u">U-Bahn</button>
      <button class="chip" data-filter="s">S-Bahn</button>
      <button class="chip" data-filter="tram">Tram</button>
      <button class="chip" data-filter="bus">Bus</button>
    </div>

    <div class="deps" id="deps">
      <div class="loading">
        <div class="spinner"></div>
        Lade Abfahrten…
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ==================== STATE ====================
    let map, stationMarker;
    let currentStation = {
      id: "de:09162:2",
      name: "Marienplatz",
      lat: 48.13725,
      lon: 11.57542
    };
    let allDepartures = [];
    let currentFilter = "all";
    let refreshTimer = null;

    // ==================== MAP ====================
    function initMap() {
      map = L.map("map", {
        zoomControl: false,
        attributionControl: false,
        preferCanvas: true
      }).setView([48.1372, 11.5755], 14);

      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        maxZoom: 19
      }).addTo(map);

      L.control.zoom({ position: "bottomright" }).addTo(map);
    }

    function setStationMarker(lat, lon) {
      if (stationMarker) map.removeLayer(stationMarker);

      stationMarker = L.marker([lat, lon], {
        icon: L.divIcon({
          className: "",
          html: '<div class="station-marker"></div>',
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        }),
        zIndexOffset: 800
      }).addTo(map);
    }

    // ==================== HELPERS ====================
    function getLineType(type, label) {
      const t = (type || "").toUpperCase();
      const l = (label || "").toUpperCase();
      if (t.includes("UBAHN") || l.startsWith("U")) return "u";
      if (t.includes("SBAHN") || l.startsWith("S")) return "s";
      if (t.includes("TRAM")) return "tram";
      if (t.includes("BUS")) return "bus";
      return "other";
    }

    function formatMinutes(ms) {
      const min = Math.round((ms - Date.now()) / 60000);
      if (min <= 0) return "jetzt";
      if (min === 1) return "1 min";
      return `${min} min`;
    }

    // ==================== API ====================
    async function searchStations(query) {
      const box = document.getElementById("results");
      if (!query || query.length < 2) {
        box.classList.remove("open");
        return;
      }

      try {
        const res = await fetch(
          `https://www.mvg.de/api/bgw-pt/v3/locations?query=${encodeURIComponent(query)}`
        );
        const data = await res.json();
        const list = (Array.isArray(data) ? data : [])
          .filter(x => x.globalId || x.id)
          .slice(0, 8);

        if (!list.length) {
          box.innerHTML = `<div class="result-item"><div class="name">Keine Treffer</div></div>`;
          box.classList.add("open");
          return;
        }

        box.innerHTML = list.map(s => `
          <div class="result-item"
               data-id="${s.globalId || s.id}"
               data-name="${s.name}"
               data-lat="${s.latitude}"
               data-lon="${s.longitude}"
               data-place="${s.place || ""}">
            <div class="name">${s.name}</div>
            <div class="meta">${s.place || "München"}</div>
          </div>
        `).join("");

        box.classList.add("open");

        box.querySelectorAll(".result-item").forEach(el => {
          el.addEventListener("click", () => {
            selectStation({
              id: el.dataset.id,
              name: el.dataset.name,
              lat: parseFloat(el.dataset.lat),
              lon: parseFloat(el.dataset.lon),
              place: el.dataset.place
            });
            box.classList.remove("open");
            document.getElementById("search").value = el.dataset.name;
          });
        });
      } catch (err) {
        box.innerHTML = `<div class="result-item"><div class="name">Verbindungsfehler</div><div class="meta">CORS oder Netzwerk</div></div>`;
        box.classList.add("open");
      }
    }

    async function loadDepartures(station) {
      const depsEl = document.getElementById("deps");
      document.getElementById("station-name").textContent = station.name;
      document.getElementById("station-sub").textContent = "Live-Abfahrten";

      depsEl.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          Lade Abfahrten…
        </div>
      `;

      try {
        let res = await fetch(
          `https://www.mvg.de/api/bgw-pt/v3/departures?globalId=${encodeURIComponent(station.id)}`
        );
        if (!res.ok) {
          res = await fetch(
            `https://www.mvg.de/api/fib/v2/departure?globalId=${encodeURIComponent(station.id)}`
          );
        }

        const data = await res.json();
        allDepartures = Array.isArray(data) ? data : (data.departures || []);

        renderDepartures();
      } catch (err) {
        console.error(err);
        depsEl.innerHTML = `
          <div class="empty-state">
            Abfahrten konnten nicht geladen werden.<br>
            <small style="opacity:0.7">API nicht erreichbar (CORS)</small>
          </div>
        `;
      }
    }

    function renderDepartures() {
      const depsEl = document.getElementById("deps");
      let list = allDepartures;

      if (currentFilter !== "all") {
        list = list.filter(d => {
          const type = getLineType(d.transportType || d.product, d.label || d.line);
          return type === currentFilter;
        });
      }

      if (!list.length) {
        depsEl.innerHTML = `<div class="empty-state">Keine Abfahrten für diesen Filter</div>`;
        return;
      }

      const now = Date.now();
      let html = "";

      list.slice(0, 20).forEach(d => {
        const label = d.label || d.line || "?";
        const dest = d.destination || d.direction || "–";
        const type = getLineType(d.transportType || d.product, label);
        const rt = d.realtimeDepartureTime || d.departureTime || now;
        const delay = d.delayInMinutes || 0;
        const platform = d.platform || d.platformChanged ? (d.platform || "") : "";
        const isLive = !!d.realtime;

        let statusHtml = "";
        if (delay > 0) {
          statusHtml = `<div class="status delay">+${delay} min</div>`;
        } else if (isLive) {
          statusHtml = `<div class="status live">LIVE</div>`;
        }

        html += `
          <div class="dep">
            <div class="line-badge ${type}">${label}</div>
            <div class="dep-info">
              <div class="dep-dest">${dest}</div>
              <div class="dep-meta">
                ${platform ? `<span>Gl. ${platform}</span>` : ""}
                ${d.cancelled ? `<span style="color:var(--danger)">entfällt</span>` : ""}
              </div>
            </div>
            <div class="dep-time">
              <div class="min">${formatMinutes(rt)}</div>
              ${statusHtml}
            </div>
          </div>
        `;
      });

      depsEl.innerHTML = html;
    }

    // ==================== STATION SELECT ====================
    function selectStation(station) {
      currentStation = station;
      setStationMarker(station.lat, station.lon);
      map.flyTo([station.lat, station.lon], 15.5, { duration: 0.85 });

      loadDepartures(station);

      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(() => loadDepartures(station), 30000);
    }

    // ==================== NEARBY ====================
    function findNearby() {
      if (!navigator.geolocation) {
        alert("Standort nicht verfügbar");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude, longitude } = pos.coords;
          map.flyTo([latitude, longitude], 15);

          try {
            // Nearby über die Locations-API versuchen
            const res = await fetch(
              `https://www.mvg.de/api/bgw-pt/v3/locations?latitude=${latitude}&longitude=${longitude}`
            );
            // Fallback: einfache Suche mit Koordinaten ist nicht immer verfügbar,
            // deshalb zeigen wir erstmal die Karte an der Position
          } catch (e) {
            console.log("Nearby API nicht verfügbar");
          }
        },
        () => alert("Standort konnte nicht ermittelt werden")
      );
    }

    // ==================== EVENTS ====================
    let searchTimeout;
    document.getElementById("search").addEventListener("input", (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        searchStations(e.target.value.trim());
      }, 250);
    });

    document.getElementById("btn-nearby").addEventListener("click", findNearby);

    // Filter chips
    document.getElementById("filters").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;

      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      currentFilter = chip.dataset.filter;
      renderDepartures();
    });

    // Close results when clicking outside
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-box")) {
        document.getElementById("results").classList.remove("open");
      }
    });

    // ==================== INIT ====================
    initMap();
    selectStation(currentStation);
  </script>
</body>
</html>
